# DSH Studio — release pipeline.
#
# One job handles BOTH triggers and always builds & publishes itself:
#   1) workflow_dispatch (recommended web UI): Actions -> release ->
#      Run workflow -> pick patch/minor/major. The job bumps the version,
#      commits, tags vX.Y.Z, pushes, then builds & publishes the installer.
#   2) push of a tag v* (e.g. manual `git push origin v0.1.9`): builds &
#      publishes that version.
#
# Note: a job that pushes tags with the built-in GITHUB_TOKEN does NOT trigger
# other workflows, so this job never relies on a second (tag) run to build.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本升级类型
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout (full history for version/tag detection)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "dsh-release-bot"
          git config user.email "well74741@users.noreply.github.com"

      # Web-UI path: bump, commit, tag and push (build runs below in this job).
      - name: Bump, tag and push (manual dispatch)
        shell: bash
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION=$(node scripts/bump-version.mjs "${{ inputs.bump }}")
          echo "tagging v${NEW_VERSION}"
          git add package.json package-lock.json
          git commit -m "chore: release v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Explicit refspecs: a stray tag named "main" (legacy mislabeled
          # release) made "git push origin main" ambiguous. Push by full ref.
          git push origin "HEAD:refs/heads/main"
          git push origin "refs/tags/v${NEW_VERSION}"

      - name: Install dependencies (pnpm, npm fallback)
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { Write-Host "pnpm install failed -> falling back to npm ci"; npm ci }

      # npm 新版本会跳过未批准的依赖安装脚本，而内核的 shell 工具依赖
      # @deepseek-ai/dsh-subprocess-local 的 postinstall 生成启动助手；
      # 这里显式补跑一次，避免“打包出来的应用里 shell 起不来”。
      - name: Ensure harness spawn helper
        shell: pwsh
        run: |
          $script = "node_modules/@deepseek-ai/dsh-subprocess-local/scripts/ensure-spawn-helper.mjs"
          if (Test-Path $script) { node $script } else { Write-Host "spawn helper script not present (kernel changed?) — skipped" }

      # Build only — publishing happens in the next step as ONE deterministic
      # Release. (electron-builder's own incremental publish created duplicate
      # Release rows with split assets, which broke auto-update.)
      - name: Build NSIS installer
        env:
          # Built-in GitHub token: no PAT/secret setup needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificate yet; disable auto certificate discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never

      # Publish exactly one Release row holding setup.exe + .blockmap +
      # latest.yml together. Leftover rows for the tag are removed first.
      # Version comes from package.json so BOTH tag pushes and manual
      # workflow_dispatch runs tag the release correctly (dispatch runs are on
      # branch "main", not on the version tag).
      - name: Publish single Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release delete "${TAG}" --yes || true
          gh release create "${TAG}" \
            release/DSH-Studio-*.exe \
            release/DSH-Studio-*.exe.blockmap \
            release/latest.yml \
            --title "${TAG}" \
            --notes "DSH Studio ${TAG}"

      - name: Show artifacts
        run: Get-ChildItem release -File | Select-Object Name, Length
