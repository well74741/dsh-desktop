# DSH Studio release: one job that always builds & publishes itself.
# - workflow_dispatch (web Run workflow, patch/minor/major) or tag push v*
name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本升级类型
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Configure git identity
        run: |
          git config user.name "dsh-release-bot"
          git config user.email "well74741@users.noreply.github.com"
      - name: Bump, tag and push (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION=$(node scripts/bump-version.mjs "${{ inputs.bump }}")
          echo "tagging v${NEW_VERSION}"
          git add package.json package-lock.json
          git commit -m "chore: release v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin main
          git push origin "v${NEW_VERSION}"
      - name: Install dependencies
        run: npm ci
      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish always
